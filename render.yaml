services:
  - type: web
    name: perfumeria-kyr
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn perfumeriakyr.wsgi:application
    envVars:
      - key: RENDER
        value: "true"
      - key: SQLITE_PATH
        value: /var/data/perfumeriakyr.sqlite3
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: perfumeria-kyr-data
      mountPath: /var/data
      sizeGB: 1
